# ==================================================================================
# TFM PLATFORM FRAMEWORK - UNIVERSAL CONFIGURATION TEMPLATE (Config-as-Code)
# Universidad Europea de Madrid · Clara Khabbazi Manzur
# ----------------------------------------------------------------------------------
# ONE ETL engine (etl_engine.py) and 8 GENERIC Lambdas interpret this file.
# To onboard ANY business (energy, telecom, retail, transport, health...) you copy
# this template, fill in the values and declare the steps/formulas.
# ZERO code changes: all scripts and Lambdas are byte-identical (same MD5).
#
# WHAT IS IDENTICAL (honest reuse):
#   - The ETL engine (etl_engine.py)    - The 8 Lambdas (no `if sector`)
#   - The State Machine (state_machine.asl.json, one, deployed per sector)
# WHAT CHANGES PER SECTOR:
#   - This YAML                          - The IAM policies (generated by build_policy.py)
#   - The dashboard (QuickSight)
# WHAT NEVER GOES HERE (security):
#   - Passwords or ARNs (they live in Secrets Manager; here only the secret_name pointer).
#
# LAYERS (0-10). Each sector config (sector_<X>_declarative.yaml) derives from here.
# ==================================================================================


# ---------------------------------------------------------------------------------
# LAYER 0 · IDENTITY & SEC-OPS (basic governance)
# ---------------------------------------------------------------------------------
metadata:
  sector_id: "<sector>"                      # energy | telecom | retail | ...
  display_name: "<Readable name>"
  data_owner: "<owner@domain>"               # for audits
  data_classification: "<public | confidential | pii>"   # GDPR classification
  environment: "production"                  # dev | production (migrate environments without touching code)
  region: "eu-west-1"
  bucket: "s3://tfm-<sector>-ckm-ew1"        # sector bucket (DIKW layers as prefixes)

dashboard:
  quicksight_dataset_id: "xxxxxxxx-xxxx-xxxx"   # SPICE dataset id (for the UpdateDashboard refresh)


# ---------------------------------------------------------------------------------
# LAYER 1 · DATA CONTRACT (structural integrity at the input)
# ---------------------------------------------------------------------------------
data_contract:
  file_format:
    separator: ","                           # "," CSV | "\t" TSV
    has_header: true                         # false -> blind plain text (mapping by index)
    format_type: "csv"                       # csv | text
    recursive_lookup: true                   # walk nested subfolders in S3
  # POSITIONAL SCHEMA (universal): if has_header=false the engine maps by `index`;
  # if has_header=true it casts by `name`. The same block documents the types in both cases.
  positional_columns:
    - { index: 0, name: "<id>",  type: "int" }
    - { index: 1, name: "<ts>",  type: "long" }
    - { index: 2, name: "<val>", type: "double" }
  schema_mapping:
    id_column: "<id>"                        # entity key (property_id | square_id)
    timestamp_column: "<ts>"                 # original time key
    timestamp_unit: "iso"                    # ms | s | iso
    value_column: "<value>"                  # main business metric
    activity_columns: []                     # metrics to sum/aggregate (telecom)
    extra_keys: []                           # extra columns (country_code...)
  expected_schema:                           # type contract (coercion + validation)
    <id>: int
    <value>: double
  # INCREMENTAL READ (generic op_read) - enabled with runtime.week_start/week_end.
  # Same code for everyone; each sector picks its mode:
  #   by_filename -> files per date: reads ONLY the week's files (saves IO). pattern uses {date}=YYYY-MM-DD.
  #   by_column   -> a single file: reads all and filters the ROWS by the date column (date_col).
  # Without this block or without a window -> reads everything (backward compatibility).
  incremental:
    mode: by_filename                        # by_filename | by_column
    pattern: "<prefix>-{date}.<ext>"         # only if by_filename
    date_col: "<raw_date_col>"               # only if by_column
  required_columns: [<id>, <ts>]             # if missing -> fail-fast


# ---------------------------------------------------------------------------------
# LAYER 2 · INFRASTRUCTURE & FIN-OPS (compute sizing)
# ---------------------------------------------------------------------------------
infrastructure_provisioning:
  glue_job_type: "python_shell"              # pyspark (Big Data) | python_shell (small scale)
  allocated_capacity:
    worker_type: "G.1X"                      # G.1X | G.2X (more RAM before moving to Spark)
    number_of_workers: 1
    auto_scaling: true
  sagemaker_instance: "ml.m5.large"          # only if the ML runs on SageMaker
  resilience:
    max_retry_attempts: 5
    backoff_rate: 2.0
  # Scaling: the REAL criterion is size (GB) vs a node's RAM, NOT the number of rows.
  # Up to ~15 GB: pandas (if RAM runs short, G.1X -> G.2X). Above: Spark, ~1 worker per ~6 GB.
  scale_up:
    ram_upgrade: "G.2X"                      # step 1: more RAM (still pandas)
    switch_to_spark_gb: 15                   # step 2: > ~15 GB -> pyspark
    engine_if_big: "pyspark"
    workers_if_big: 2                        # Glue Spark minimum
    max_workers_limit: 10                    # budget ceiling
    subpartition_if_big: [<id>]
  finops_governance:
    s3_lifecycle:                            # automatic retention (cost saving)
      - { prefix: "raw/",        transition_glacier_days: 90 }
      - { prefix: "processed/",  retention_years: 5 }
      - { prefix: "quality/",    expire_days: 30 }
      - { prefix: "tmp/",        expire_days: 7 }
    tags: { Sector: "<sector>", Environment: "production", Project: "TFM" }
  # Network note: the pipeline does NOT use NAT. Private S3 access is solved with an S3 Gateway
  # Endpoint (free) and dependencies ship as pre-built layers -> no internet egress.


# ---------------------------------------------------------------------------------
# LAYER 3 · DATA QUALITY GATES (input filters / contracts)
# ---------------------------------------------------------------------------------
data_quality_gates:
  fail_fast_on_schema_violation: true        # stop if the raw data violates the contract
  max_size_mb: null                          # optional size cap (null = no cap)
  rules:                                     # declarative rules the data MUST satisfy
    - "IsComplete(<id>)"                     # primary key with no nulls
    - "ColumnValues(<value>) >= 0"           # business rule (non-negative)
    - "RowCount > 0"                         # non-empty batch


# ---------------------------------------------------------------------------------
# LAYER 4 · MULTI-PURPOSE PIPELINE (EDA vs ML targets from the same data)
# The engine runs the recipe Step Functions asks for (--recipe eda_steps | ml_steps | both).
# ---------------------------------------------------------------------------------
eda_pipeline:
  sampling_rate: 1.00                        # descriptive: 100% (or <1 to sample Big Data)
  keep_raw_outliers: true                    # in EDA they are MARKED, not removed
  keep_extra_keys: true                      # keeps context for the dashboard
  output_path: "s3://tfm-<sector>-ckm-ew1/processed/"
ml_pipeline:
  sampling_rate: 1.00                        # 100% for training
  keep_raw_outliers: false                   # marked/excluded so as not to harm the model
  keep_extra_keys: false                     # reduces dimensionality/noise
  output_path: "s3://tfm-<sector>-ckm-ew1/ml_input/"


# ---------------------------------------------------------------------------------
# LAYER 5 · DECLARATIVE ETL (step recipe + formulas; STEP_REGISTRY)
# The engine iterates the steps in order. FORMULAS are declared as text and evaluated
# by the Expression Evaluator (F.expr in Spark / df.eval in pandas).
# ---------------------------------------------------------------------------------
etl:
  source:
    source: "s3://tfm-<sector>-ckm-ew1/raw/"
    format: "csv"                            # csv | tsv | text
    header: true
    columns: []                              # required if header:false (positional schema)
  ml_steps:                                  # CLEAN dataset for the model (per-row features)
    - step: cast_types
      params: { types: {} }
    - step: normalize_time
      params: { source_col: "<ts>", unit: "iso", target: "ds", floor: "day" }
    - step: fill_zeros                        # NULL = "not applicable" -> 0 (business rule)
      params: { columns: [] }
    - step: drop_nulls
      params: { columns: [<id>, ds] }
    - step: aggregate                         # aggregates to the model grain (e.g. daily)
      params: { group_by: [<id>, ds], agg: { y: "sum(<value>)" } }
    - step: datetime_features                 # deterministic from ds (no leak)
      params: { source: ds, features: [day_of_week, month, week_of_year, is_weekend] }
    - step: add_holiday_flag
      params: { source: ds, out_col: is_holiday, holidays_file: "s3://tfm-config-ckm-ew1/exog/<holidays>.csv" }
    - step: join_reference                    # exogenous variable (temperature, etc.)
      params: { ref_source: "s3://tfm-config-ckm-ew1/exog/<exog>.csv", left_on: ds, right_on: time }
    - step: add_lags                          # backward-looking lags (no leak)
      params: { column: y, group: <id>, lags: { lag_1d: 1, lag_7d: 7, lag_28d: 28 } }
    - step: derive_columns                    # per-row formulas (Expression Evaluator)
      params: { columns: {} }
    - step: write_parquet
      params: { target: "s3://tfm-<sector>-ckm-ew1/ml_input/", partition_by: [] }
  eda_steps:                                 # descriptive dataset (the "flat table") for the dashboard
    - step: cast_types
      params: { types: {} }
    - step: normalize_time
      params: { source_col: "<ts>", unit: "iso", target: "ds", floor: "hour" }
    - step: flag_outliers                     # marks outliers (is_outlier), does not remove them
      params: { column: <value>, group: <id> }
    - step: datetime_features
      params: { source: ds, features: [hour, day_of_week, month, is_weekend] }
    - step: write_parquet
      params: { target: "s3://tfm-<sector>-ckm-ew1/processed/", partition_by: [] }
    # sink_analytics: loads the processed/ flat table -> RDS (only if storage.analytical=rds).
    # It can run here (ETL in the VPC) or be delegated to the AggregateMetrics Lambda (Option B,
    # ETL outside the VPC). With Athena it is a no-op (the parquet in S3 is already the table).
    # - step: sink_analytics
    #   params: {}
  optional_features:
    has_geospatial_enrichment: false          # JOIN with a grid/map (telecom)
    geospatial_grid_size: 100


# ---------------------------------------------------------------------------------
# LAYER 6 · HYBRID ML GOVERNANCE (rails for the sector-specific script)
# The ML is sector-specific, but it is GOVERNED from the YAML (config-driven).
# ---------------------------------------------------------------------------------
ml:
  task: "<forecasting | anomaly_detection>"
  retrain_weekly: false                       # true -> TrainModel every week | false -> uses the pre-trained model
  inference_engine: "<glue | sagemaker>"
  script_artifact_path: "s3://tfm-config-ckm-ew1/scripts/<ml_script>.py"   # dynamic dispatch
  candidates: []                              # candidate models to try per entity
  group_by_column: "<id>"                     # trains one model per entity
  eval_metric: "<wape | recall | r2 | f1>"    # gate metric (read by EvaluateModel)
  threshold: 0.20                             # approval threshold (EvalGate). wape<0.20 | recall>=0.80 ...
  forecast_horizon_weeks: 4                   # forecast horizon (if task=forecasting)
  model_features_from_train: [statistical_imputation, lags, rolling_means]   # computed in ML (no leak)
  data_io:
    input_features_path: "s3://tfm-<sector>-ckm-ew1/ml_input/"
    output_path: "s3://tfm-<sector>-ckm-ew1/ml/"      # predictions, forecast, model_metrics.json
    model_registry_path: "s3://tfm-<sector>-ckm-ew1/models/"
  fault_tolerance:
    on_failure_strategy: "quarantine"         # isolates the failing entity and continues
    max_quarantine_tolerance_rate: 0.02       # circuit breaker: aborts if > 2% fail
  data_drift_monitoring:
    enabled: true
    metric: "PSI"                             # Population Stability Index
    alert_threshold: 0.25


# ---------------------------------------------------------------------------------
# LAYER 7 · KPIs / ANALYTICS (the QUERIES live here -> GENERIC aggregate_metrics)
# The same Lambda runs the queries against the declared engine (rds | athena | csv).
# Feeds the REPORT with numbers as text (Bedrock cannot read the dashboard).
# ---------------------------------------------------------------------------------
analytics_source:
  engine: "<rds | athena | csv>"              # energy=rds (PostgreSQL) | telecom=athena (S3)
  database: "<db>"
  table: "<table>"
  secret_name: "<path in Secrets Manager>"    # only if engine=rds (or via env vars in the VPC demo)
  model_metrics_key: "ml/model_metrics.json"  # -> {ml_results}: WAPE, R2, net error, per property
  forecast_key: "ml/forecast_4semanas.csv"    # -> {forecast_semanal}: prediction per property/day
  forecast_agg:                               # how the Lambda aggregates the forecast (N days -> weeks)
    date_col: "fecha"
    value: "prediccion"
    weeks: 4
    by_property: [<id>]
    by_segment: "<segment>"
    reliability: "wape"
  # Report queries (SQL with {week_start}/{week_end}/{prev_week_start} in rds, {periodo}/{scope} in athena):
  kpi_queries:
    <kpi_1>: "SELECT ... FROM <table> WHERE ..."
  alerts_query: "SELECT ... FROM <table> WHERE ... LIMIT 5"     # anomalies / peaks
  trend_query: "SELECT ... FROM <table> ... LIMIT 5"           # trend (going up/down)


# ---------------------------------------------------------------------------------
# LAYER 8 · GENERATIVE REPORTING (the PROMPT lives here -> GENERIC generate_narrative)
# ---------------------------------------------------------------------------------
executive_reporting:
  bedrock_model_id: "eu.amazon.nova-pro-v1:0"
  prompt_template: |
    <role, context, sections and language of the report.
     Available placeholders: {kpi_summary} {ml_results} {forecast_semanal} {alerts} {historico} {stakeholder} {week}>

reporting:
  schedule: "cron(0 6 ? * MON *)"             # EventBridge (Monday 06:00)
  slm_model: "eu.amazon.nova-pro-v1:0"
  stakeholder: "<report recipient role>"
  language: "<es | en>"
  recipients: ["<email>"]                     # PDF recipients (SES)
  sender: "<SES-verified email>"              # sender (verified identity; institutional email)
  report_cards:                               # PDF KPI cards (config-driven)
    - { label: "<Label>", key: "<kpi_key>" }                    # source: ml to read from ml_results
  report_chart: { title: "<Title>", x: "week", y: "<series>" }  # PDF trend chart


# ---------------------------------------------------------------------------------
# LAYER 9 · GOVERNANCE, LINEAGE & COMPLIANCE
# ---------------------------------------------------------------------------------
governance:
  quality_uri: "s3://tfm-<sector>-ckm-ew1/quality/"   # mandatory JSON quality report
  version_control:
    data_version: "v<yyyy.mm>"                # raw dataset version (reproducibility)
    track_config_version: true                # S3 version of the YAML used
  retention_policy:
    raw_days: 90
    processed_years: 5
  compliance:
    compliance_mode: "compliance_regulatory"
    worm_retention_days: 365                   # S3 Object Lock (WORM): immutable evidence
  alerting:
    alert_severity: "high"
    notification_topic: "arn:aws:sns:<region>:<account>:EtlAlerts"


# ---------------------------------------------------------------------------------
# LAYER 10 · ANALYTICAL STORAGE & SECURITY
# ---------------------------------------------------------------------------------
storage:
  analytical: "<rds | athena>"
  database: "<db>"
  port: 5432                                  # only if analytical=rds
  secret_name: "<path in Secrets Manager>"    # ONLY the pointer (NOT the password)
  dashboard_table: "<flat_table>"             # table QuickSight reads (descriptive flat table)
  dashboard_source: "processed/data.parquet"  # where the flat table is loaded into RDS from

security:
  encryption: "<SSE-S3 | SSE-KMS>"            # SSE-KMS -> build_policy.py adds the KMS block
  kms_key_alias: "alias/tfm-<sector>-key"     # only if encryption=SSE-KMS
  vpc_enabled: false                          # true if the analytical layer is RDS (private subnet)
  block_public_access: true
  versioning: true                            # raw/ immutable (audit trail)
  iam_role: "arn:aws:iam::<account>:role/tfm-<sector>-pipeline-role"   # ONLY to derive the account id
  # The IAM POLICY is not written here: it is generated by iam/build_policy.py reading this YAML.
  # RDS credentials: by default Secrets Manager; in the VPC demo they are injected as the Lambda's
  # encrypted environment variables (RDS_HOST/RDS_USER/RDS_PASSWORD/RDS_DB) to avoid the cost of the
  # Secrets Manager interface endpoint. In production the endpoint is added.
